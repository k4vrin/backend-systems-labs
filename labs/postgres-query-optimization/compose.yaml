name: backend-systems-query-lab

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${LAB_DB_NAME:-backend_labs}
      POSTGRES_USER: ${LAB_DB_USER:-labs}
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:-labs-local-only}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
    ports:
      - "127.0.0.1:${LAB_DB_PORT:-55432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./:/workspace:ro

volumes:
  postgres-data:
